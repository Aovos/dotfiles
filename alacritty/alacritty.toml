[window]
opacity = 1.0
padding = { x = 20, y = 20 }
dynamic_padding = true

[font]
size = 12.0

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[font.bold]
style = "Bold"

[font.italic]
style = "Italic"

[cursor]
blink_interval = 400
blink_timeout = 0
unfocused_hollow = false
thickness = 0.15

[cursor.style]
shape = "Beam"
blinking = "On"

[colors.selection]
text = "CellForeground"
background = "#444444"
